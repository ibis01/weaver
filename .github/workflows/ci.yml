name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies from lockfile
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      # ── FIX: Build the bundle BEFORE running tests ──────────
      # The E2E tests require dist/bundle.min.js to exist. Since dist/
      # is typically gitignored, it must be generated in CI before
      # Playwright attempts to load the application.
      - name: Build production bundle
        run: npm run build && npm run minify

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run unit tests
        run: npm run test:unit -- --bail

      - name: Run integration tests
        run: npm run test:integration -- --bail

      - name: Run security tests
        run: npm run test:security -- --bail

      - name: Run end-to-end tests
        run: npm run test:e2e -- --bail

      - name: Upload production bundle
        uses: actions/upload-artifact@v3
        with:
          name: weaver-browser-bundle-${{ github.sha }}
          path: |
            dist/bundle.js
            dist/bundle.min.js
          if-no-files-found: error

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v3
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore