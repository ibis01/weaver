name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Check for Playwright
        id: playwright-check
        run: |
          if npm list @playwright/test >/dev/null 2>&1; then
            echo "has_playwright=true" >> $GITHUB_OUTPUT
          fi

      - name: Install Playwright browsers
        if: steps.playwright-check.outputs.has_playwright == 'true'
        run: npx playwright install --with-deps

      - name: Run unit tests
        run: npm run test:unit -- --bail

      - name: Run integration tests
        run: npm run test:integration -- --bail

      - name: Run security tests
        run: npm run test:security -- --bail

      - name: Run E2E tests
        if: steps.playwright-check.outputs.has_playwright == 'true'
        run: npm run test:e2e -- --bail

      - name: Build production bundle
        run: npm run build && npm run minify
