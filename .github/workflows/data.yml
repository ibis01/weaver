name: Market Data Snapshot

on:
  schedule:
    # Run every hour to keep snapshots fresh and respect free-tier rate limits
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: market-data-refresh
  cancel-in-progress: true

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Fetch and validate market snapshots
        shell: bash
        run: |
          set -euo pipefail
          tmp_dir="$(mktemp -d)"
          trap 'rm -rf "$tmp_dir"' EXIT
          
          # Robust fetch function with retries and strict TLS
          fetch_json() {
            local url="$1"
            local output="$2"
            curl --fail-with-body --show-error --silent --location \
              --proto '=https' --tlsv1.2 \
              --retry 3 --retry-delay 2 --connect-timeout 10 --max-time 60 \
              -A 'WeaverDataBot/1.0' "$url" -o "$output"
          }

          echo "Fetching top 100 assets from CoinPaprika..."
          fetch_json "https://api.coinpaprika.com/v1/tickers?limit=100&quotes=usd" "$tmp_dir/raw_top.json"
          
          # Transform CoinPaprika schema to match Weaver's expected live-app schema
          jq '[.[] | {
            id: .id,
            symbol: .symbol,
            name: .name,
            current_price: .quotes.USD.price,
            market_cap: .quotes.USD.market_cap,
            total_volume: .quotes.USD.volume_24h,
            price_change_percentage_24h_in_currency: .quotes.USD.percent_change_24h,
            price_change_percentage_7d_in_currency: .quotes.USD.percent_change_7d,
            price_change_percentage_30d_in_currency: .quotes.USD.percent_change_30d,
            sparkline_in_7d: null,
            market_cap_rank: .rank
          }]' "$tmp_dir/raw_top.json" > "$tmp_dir/top.json"

          echo "Fetching global market stats from CoinPaprika..."
          fetch_json "https://api.coinpaprika.com/v1/global" "$tmp_dir/raw_global.json"
          
          # Transform global stats into the same shape the live
          # provider returns, so the runtime schema validates one
          # shape only. Wrap the numeric fields in { usd: ... } and
          # put everything under a top-level "data" key.
          jq '{
            data: {
              active_cryptocurrencies: .cryptocurrencies_number,
              markets: null,
              total_market_cap: { usd: .market_cap_usd },
              total_volume: { usd: .volume_24h_usd },
              market_cap_percentage: {
                btc: .bitcoin_dominance_percentage
              },
              market_cap_change_percentage_24h_usd: (
                if .market_cap_usd and .market_cap_change_24h
                then ((.market_cap_change_24h /
                       (.market_cap_usd - .market_cap_change_24h)) * 100)
                else null
                end
              ),
              updated_at: ((.last_updated | fromdateiso8601) * 1000)
            }
          }' "$tmp_dir/raw_global.json" > "$tmp_dir/global.json"

          echo "Fetching Fear & Greed Index..."
          fetch_json "https://api.alternative.me/fng/?limit=1" "$tmp_dir/fng.json"

          # Validation checks (Constitution §3.4: Fail gracefully but catch bad data early in CI)
          echo "Validating top.json..."
          jq -e 'type == "array" and length > 0 and all(.[]; (.id | type == "string") and (.current_price | type == "number"))' "$tmp_dir/top.json" >/dev/null
          
          echo "Validating global.json..."
          jq -e '.data | has("total_market_cap") and (.total_market_cap | has("usd")) and (.market_cap_percentage | has("btc"))' "$tmp_dir/global.json" >/dev/null
          
          echo "Validating fng.json..."
          jq -e 'has("data") and (.data | type == "array") and (.data | length > 0)' "$tmp_dir/fng.json" >/dev/null

          # Commit to data directory
          mkdir -p data
          mv "$tmp_dir/top.json" data/top.json
          mv "$tmp_dir/global.json" data/global.json
          mv "$tmp_dir/fng.json" data/fng.json

      - name: Commit validated snapshots
        run: |
          git config user.name "weaver-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "chore(data): refresh market snapshots via CoinPaprika

          - Aligned CI snapshot pipeline with live app provider architecture
          - Removed stale CoinGecko/CryptoCompare dependencies
          - Ensured schema compatibility (current_price, market_cap_percentage.btc)
          - Resolves P1 integration consistency issue"
          git push