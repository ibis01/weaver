# Dependency Review: fails PRs that introduce known high/critical
# vulnerabilities or disallowed licenses. Complements the npm audit
# gates (which run against the full tree on main) by guarding the PR
# boundary itself.
name: Dependency Review

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Dependency review
        uses: actions/dependency-review-action@e58c696e52cac8e62d61cc21fda89565d71505d7 # v4.3.1
        with:
          fail-on-severity: high
          comment-summary-in-pr: always
