# Dependency Review: fails PRs that introduce known high/critical
# vulnerabilities or disallowed licenses. Complements the npm audit
# gates (which run against the full tree on main) by guarding the PR
# boundary itself.
name: Dependency Review

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Dependency review
        # continue-on-error: this repo's dependency graph is not enabled
        # yet (Settings > Code security > Dependency graph). Until the
        # operator flips that switch, the action cannot retrieve advisory
        # data and would fail every PR. Vulnerability checking meanwhile
        # remains enforced by the npm audit gates in test-and-build.yml.
        continue-on-error: true
        uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: high
          comment-summary-in-pr: always
