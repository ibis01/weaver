# Dependency Review: fails PRs that introduce known high/critical
# vulnerabilities or disallowed licenses. Complements the npm audit
# gates (which run against the full tree on main) by guarding the PR
# boundary itself.
#
# BLOCKING since 2026-11-24: the repo is public, so the dependency
# graph and Dependabot alerts are enabled by default and the action
# can retrieve advisory data. continue-on-error was removed and the
# job verified green in blocking mode on the hardening PR that landed
# this change. Required at the main boundary via branch protection
# (see docs/release-matrix.md > Recorded control state).

name: Dependency Review

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Dependency review
        uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: high
          comment-summary-in-pr: always
