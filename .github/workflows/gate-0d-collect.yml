name: Gate 0d — prospective collection

on:
  schedule:
    - cron: '0 0 * * 0'  # Sundays 00:00 UTC
  workflow_dispatch:      # manual trigger

jobs:
  collect:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ssh-key: ${{ secrets.DEPLOY_KEY }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Refresh price history
        # The scorer cannot resolve outcomes without a price series that
        # extends past each buy + 14d. A failed refresh must never block
        # collection; scoring will mark uncovered outcomes unresolved
        # (retry-eligible) and the next run re-attempts them.
        env:
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
        continue-on-error: true
        run: node scripts/oneoff/fetch-pepe-prices.js
      - name: Collect + score
        env:
          BLOCKSCOUT_API_KEY: ${{ secrets.BLOCKSCOUT_API_KEY }}
        run: |
          node scripts/oneoff/prospective-collect.js
          node scripts/oneoff/prospective-score.js
      - name: Commit new buys
        run: |
          git config user.name "weaver-bot"
          git config user.email "bot@weaver.local"
          git add data/prospective/
          git diff --cached --quiet || git commit -m "data(gate-0d): weekly collection $(date -u +%Y-%m-%d) [skip ci]"
          git push
