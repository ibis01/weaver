name: Test and Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs for the same branch when a new push lands.
# Saves CI minutes and avoids racing deploys.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Print Node and npm versions
        run: |
          node -v
          npm -v

      - name: Install dependencies
        run: npm ci

      - name: Build bundle
        run: npm run build

      - name: Minify bundle
        run: npm run minify

      - name: Verify bundle artifacts exist
        run: |
          test -f dist/bundle.js
          test -f dist/bundle.min.js
          test -f js/failsafe.js

      - name: Verify no inline styles remain in index.html
        run: |
          if grep -qE 'style="' index.html; then
            echo "::error::Inline style attribute found in index.html"
            exit 1
          fi

      - name: Verify no inline event handlers remain in index.html
        run: |
          if grep -qE 'on(click|load|error|change|input|submit)="' index.html; then
            echo "::error::Inline event handler found in index.html"
            exit 1
          fi

      - name: Verify failsafe.js is not bundled
        run: |
          if grep -q "failsafe" concat.js; then
            echo "::error::js/failsafe.js must not be in concat.js"
            exit 1
          fi

      - name: Root unit tests
        run: npm run test:unit

      - name: Root integration tests
        run: npm run test:integration

      - name: Root security tests
        run: npm run test:security

      - name: Worker tests
        working-directory: cf-worker
        run: |
          npm ci
          npm test --if-present

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Playwright E2E
        run: npm run test:e2e

      # Upload both the HTML report and the trace/screenshot/video
      # directory. Previously the artifact was named "playwright-report"
      # but only contained test-results/, so the HTML report was lost
      # every time a test failed.
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7