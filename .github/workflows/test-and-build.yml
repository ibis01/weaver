name: Test and Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install root dependencies
        run: npm ci

      - name: Build application bundles
        run: npm run build && npm run minify

      - name: Run root unit tests
        run: npm run test:unit

      - name: Run root integration tests
        run: npm run test:integration

      - name: Run root security tests
        run: npm run test:security

      - name: Install Worker dependencies
        working-directory: ./cf-worker
        run: npm ci

      - name: Run Cloudflare Worker tests
        working-directory: ./cf-worker
        run: npx vitest run