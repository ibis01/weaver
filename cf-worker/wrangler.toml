name = "weaver-proxy"
main = "index.js"
compatibility_date = "2024-09-01"

# Existing KV binding
[[kv_namespaces]]
binding = "MEME_ALERTS"
id = "711edb1aa070446ea6ccbf81d26135a4"

# New D1 binding for Phase 4 snapshots
[[d1_databases]]
binding = "weaver_snapshots"
