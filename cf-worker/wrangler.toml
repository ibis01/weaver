name = "weaver-proxy"
main = "index.js"
compatibility_date = "2024-09-01"

# Free tier: 100,000 requests/day, no billing required.
# MEME_ALERTS KV is bound for alert persistence (7d TTL).

# Required secret. Deploy (or `wrangler dev`) will fail if this is
# not configured. Set it with:
#   npx wrangler secret put BITQUERY_KEY
#
# The GoPlus routes work without this secret; only the
# /bitquery/deployer route returns 503 when it is missing.
[secrets]
required = ["BITQUERY_KEY"]
[[kv_namespaces]]
binding = "MEME_ALERTS"
id = "711edb1aa070446ea6ccbf81d26135a4"