name: weaver-production

services:
  proxy:
    build:
      context: .
      dockerfile: Dockerfile.proxy
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PROXY_PORT: "3001"
    expose:
      - "3001"
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 5

  worker:
    build:
      context: .
      dockerfile: Dockerfile.meme-worker
    env_file:
      - .env
    environment:
      NODE_ENV: production
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    depends_on:
      proxy:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    ports:
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-8080}:8080"
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    security_opt:
      - no-new-privileges:true
    depends_on:
      proxy:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 5

# Production Redis is intentionally external and must be supplied as a TLS
# REDIS_URL (rediss://) through the deployment secret manager. This avoids
# exposing an unauthenticated in-cluster Redis and preserves shared state
# across replicas and restarts.
