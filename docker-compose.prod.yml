# Weaver production topology (docs/deployment-blueprint.md).
#
#   web     Nginx static frontend + reverse proxy (:8080)
#   proxy   Weaver secure proxy (node, non-root, :3001 internal)
#   redis   Redis 7, TLS-only + password, AOF + RDB, internal network only
#   backup  (profile "backup") timestamped RDB backups -> /backups volume
#
# TLS note: server/config.js REQUIRES rediss:// (TLS) for REDIS_URL in
# production. This file therefore provisions Redis with a TLS-only
# listener (--port 0 --tls-port 6379) whose certificate material is
# generated by the one-shot redis-cert-gen container (self-signed CA,
# SAN DNS:redis). The proxy and the backup worker trust that CA via
# REDIS_TLS_CACERT / NODE_EXTRA_CA_CERTS. All traffic stays on the
# internal compose network; nothing else is published.
#
# Required environment (in .env.production, never committed):
#   REDIS_PASSWORD     Redis auth + part of the proxy's REDIS_URL
#   ALLOWED_ORIGINS    comma-separated browser origins, e.g.
#                      https://ibis01.github.io
# Optional:
#   ALERT_WEBHOOK_URL          https:// telemetry alert webhook
#   BACKUP_INTERVAL_SECONDS    backup cadence (default 21600 = 6h)
#
# Usage:
#   cp .env.example .env.production   # fill in real values
#   docker compose --env-file .env.production -f docker-compose.prod.yml up -d --build web proxy redis
#   docker compose --env-file .env.production -f docker-compose.prod.yml --profile backup up -d backup

services:
  redis-cert-gen:
    build:
      context: .
      dockerfile: deploy/redis-cert-gen.Dockerfile
    volumes:
      - redis-certs:/certs

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    depends_on:
      redis-cert-gen:
        condition: service_completed_successfully
    command:
      - sh
      - -c
      - |
        exec redis-server \
          --port 0 \
          --tls-port 6379 \
          --tls-cert-file /certs/redis.crt \
          --tls-key-file /certs/redis.key \
          --tls-ca-cert-file /certs/ca.crt \
          --tls-auth-clients no \
          --requirepass "$$REDIS_PASSWORD" \
          --appendonly yes \
          --save "60" "1" \
          --dir /data
    environment:
      REDIS_PASSWORD: "${REDIS_PASSWORD:?REDIS_PASSWORD is required (export it or use --env-file .env.production)}"
    volumes:
      - redis-certs:/certs:ro
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --tls --cacert /certs/ca.crt -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 15s
    networks:
      - backend

  proxy:
    build:
      context: .
      dockerfile: Dockerfile.proxy
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      REDIS_URL: "rediss://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379"
      REDIS_NAMESPACE: weaver
      ALLOWED_ORIGINS: "${ALLOWED_ORIGINS:?ALLOWED_ORIGINS is required (comma-separated browser origins)}"
      TRUST_PROXY_HOPS: "1"
      NODE_EXTRA_CA_CERTS: /certs/ca.crt
      ALERT_WEBHOOK_URL: "${ALERT_WEBHOOK_URL:-}"
    volumes:
      - redis-certs:/certs:ro
    networks:
      - frontend
      - backend

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    restart: unless-stopped
    depends_on:
      proxy:
        condition: service_healthy
    ports:
      - "8080:8080"
    networks:
      - frontend

  backup:
    profiles:
      - "backup"
    image: redis:7-alpine
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      REDIS_URL: "rediss://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379"
      REDIS_TLS_CACERT: /certs/ca.crt
      BACKUP_DIR: /backups
      BACKUP_INTERVAL_SECONDS: "${BACKUP_INTERVAL_SECONDS:-21600}"
    volumes:
      - redis-certs:/certs:ro
      - backups:/backups
      - ./scripts:/weaver-scripts:ro
    command:
      - sh
      - -c
      - |
        while true; do
          /bin/sh /weaver-scripts/backup-redis.sh || echo "backup failed; retrying next interval"
          sleep "$$BACKUP_INTERVAL_SECONDS"
        done
    networks:
      - backend

volumes:
  redis-certs:
  redis-data:
  backups:

networks:
  frontend:
  backend:
    internal: true
