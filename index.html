<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Weaver — Crypto Portfolio & AI Insights</title>
<link rel="icon" href="assets/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand"><img src="assets/logo.png" alt="Weaver"><span>Weaver</span></div>
    <nav id="nav"></nav>
    <div class="sidebar-foot"><button id="btn-pro" class="pro-pill">✨ Upgrade to Pro</button></div>
  </aside>
  <main class="main">
    <header class="topbar">
      <div class="topbar-title" id="page-title">Dashboard</div>
      <div class="topbar-actions">
        <select id="currency"></select>
        <button id="btn-refresh" class="btn ghost" title="Refresh">⟳</button>
        <span id="last-updated" class="muted small"></span>
      </div>
    </header>
    <section id="view" class="view"></section>
  </main>
</div>
<div id="modal-root"></div>
<div id="toasts" class="toasts"></div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="js/utils/format.js"></script>
<script src="js/utils/debounce.js"></script>
<script src="js/storage/storage.js"></script>
<script src="js/api/prices.js"></script>
<script src="js/ui/ui.js"></script>
<script src="js/features/portfolio.js"></script>
<script src="js/features/watchlist.js"></script>
<script src="js/ui/dashboard.js"></script>
<script src="js/features/explorer.js"></script>
<script src="js/features/alerts.js"></script>
<script src="js/features/news.js"></script>
<script src="js/features/market.js"></script>
<script src="js/features/ai.js"></script>
<script src="js/features/learn.js"></script>
<script src="js/features/web3.js"></script>
<script src="js/features/misc.js"></script>
<script src="js/app.js"></script>
</body>
</html>
