<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- STRICT CONTENT SECURITY POLICY -->
    <meta
      http-equiv="Content-Security-Policy"
      content="
    default-src 'self';
    script-src 'self';
    style-src 'self' https://fonts.googleapis.com 'unsafe-inline';
    font-src 'self' https://fonts.gstatic.com;
    img-src 'self' data: https:;
    connect-src 'self' https://api.coingecko.com https://api.binance.com https://api.mainnet-beta.solana.com http://localhost:3001;
    object-src 'none';
    base-uri 'self';
    form-action 'self';
  "
    />

    <title>Weaver — Crypto Portfolio</title>
    <title>Weaver — Crypto Portfolio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..700&family=Sora:wght@400;600;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- Ambient background -->
    <div class="bg">
      <div class="orb o1"></div>
      <div class="orb o2"></div>
      <div class="orb o3"></div>
      <div class="grid-lines"></div>
      <div class="noise"></div>
    </div>

    <div class="app">
      <!-- Sidebar -->
      <aside class="sidebar">
        <div class="brand">
          <img src="assets/logo.png" alt="Weaver" />
          <span>Weaver</span>
        </div>
        <nav id="nav">
          <!-- Navigation items will be generated by app.js -->
        </nav>
      </aside>

      <!-- Main content -->
      <main class="main">
        <!-- Top Bar -->
        <header class="topbar">
          <h1 class="topbar-title" id="page-title">Dashboard</h1>
          <div class="topbar-actions">
            <span id="clock" class="muted small"></span>
            <select id="currency" aria-label="Currency">
              <option value="usd">USD</option>
              <option value="ngn">NGN</option>
              <option value="eur">EUR</option>
              <option value="gbp">GBP</option>
              <option value="inr">INR</option>
              <option value="jpy">JPY</option>
              <option value="aud">AUD</option>
              <option value="cad">CAD</option>
              <option value="btc">BTC</option>
              <option value="eth">ETH</option>
            </select>
            <button
              class="icon-btn"
              id="sync-btn"
              title="Sync"
              onclick="W.syncVault()"
            >
              🔄
            </button>
          </div>
        </header>

        <!-- MAIN VIEW CONTAINER -->
        <div id="view"></div>
      </main>
    </div>

    <!-- Toasts -->
    <div class="toasts" id="toasts"></div>

    <!-- Modal root -->
    <div id="modal-root"></div>
        <!-- Utilities -->
    <script src="js/utils/format.js"></script>
    <script src="js/utils/finance.js"></script> 
    <script src="js/utils/debounce.js"></script>
    <!-- Storage -->
    <script src="js/lib/crypto/secure.js"></script>
    <script src="js/storage/storage.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="dist/bundle.min.js"></script>

    <script src="js/init.js"></script>
  </body>
</html>
