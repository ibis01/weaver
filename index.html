<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- STRICT CONTENT SECURITY POLICY -->
    <meta
      http-equiv="Content-Security-Policy"
      content="
    default-src 'self';
    script-src 'self' https://cdn.jsdelivr.net;
    style-src 'self' https://fonts.googleapis.com 'unsafe-inline';
    font-src 'self' https://fonts.gstatic.com;
    img-src 'self' data: https:;
    connect-src 'self' 
      https://api.coingecko.com 
      https://api.binance.com 
      https://api.mainnet-beta.solana.com 
      https://api.alternative.me 
      https://api.allorigins.win 
      https://api.codetabs.com 
      https://eth.blockscout.com 
      http://localhost:3001;
    object-src 'none';
    base-uri 'self';
    form-action 'self';
  "
    />
    <title>Weaver — Crypto Portfolio</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..700&family=Sora:wght@400;600;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- Ambient background -->
    <div class="bg">
      <div class="orb o1"></div>
      <div class="orb o2"></div>
      <div class="orb o3"></div>
      <div class="grid-lines"></div>
      <div class="noise"></div>
    </div>

    <div class="app">
      <!-- Sidebar -->
      <aside class="sidebar">
        <div class="brand">
          <img src="assets/logo.png" alt="Weaver" />
          <span>Weaver</span>
        </div>
        <nav id="nav">
          <!-- Navigation items will be generated by app.js -->
        </nav>
      </aside>

      <!-- Main content -->
      <main class="main">
        <!-- Top Bar -->
        <header class="topbar">
          <h1 class="topbar-title" id="page-title">Dashboard</h1>
          <div class="topbar-actions">
            <span id="clock" class="muted small"></span>
            <select id="currency" aria-label="Currency">
              <option value="usd">USD</option>
              <option value="ngn">NGN</option>
              <option value="eur">EUR</option>
              <option value="gbp">GBP</option>
              <option value="inr">INR</option>
              <option value="jpy">JPY</option>
              <option value="aud">AUD</option>
              <option value="cad">CAD</option>
              <option value="btc">BTC</option>
              <option value="eth">ETH</option>
            </select>
            <button
              class="icon-btn"
              id="sync-btn"
              title="Sync"
              onclick="if (W && W.sync && W.sync.syncVault) W.sync.syncVault();"
            >
              🔄
            </button>
          </div>
        </header>

        <!-- MAIN VIEW CONTAINER -->
        <div id="view"></div>
      </main>
    </div>

    <!-- Toasts -->
    <div class="toasts" id="toasts"></div>

    <!-- Modal root -->
    <div id="modal-root"></div>

    <!-- =================================================== -->
    <!-- Core Libraries (Load in strict dependency order)    -->
    <!-- =================================================== -->

    <!-- 1. Storage (MUST LOAD FIRST - provides W.store) -->
    <script src="js/storage/storage.js"></script>

    <!-- 2. Crypto (for secure encryption) -->
    <script src="js/lib/crypto/secure.js"></script>

    <!-- 3. Utilities -->
    <script src="js/utils/format.js"></script>
    <script src="js/utils/finance.js"></script>
    <script src="js/utils/debounce.js"></script>

    <!-- 4. UI Core -->
    <script src="js/ui/theme.js"></script>
    <script src="js/ui/ui.js"></script>
    <script src="js/ui/dashboard.js"></script>

    <!-- 5. API Layer -->
    <script src="js/api/prices.js"></script>
    <script src="js/api/snapshot.js"></script>

    <!-- 6. AI Providers (before features/ai.js) -->
    <script src="js/ai/providers.js"></script>

    <!-- 7. Intelligence Layer -->
    <script src="js/intelligence/evidence.js"></script>

    <!-- 8. Features  -->
    <script src="js/features/portfolio.js"></script>
    <script src="js/features/watchlist.js"></script>
    <script src="js/features/explorer.js"></script>
    <script src="js/features/alerts.js"></script>
    <script src="js/features/news.js"></script>
    <script src="js/features/ai.js"></script>
    <script src="js/features/optimizer.js"></script>
    <script src="js/features/timemachine.js"></script>
    <script src="js/features/trader.js"></script>
    <script src="js/features/gems.js"></script>
    <script src="js/features/shield.js"></script>
    <script src="js/features/web3.js"></script>
    <script src="js/features/misc.js"></script>
    <script src="js/features/whales.js"></script>
    <script src="js/features/smart.js"></script>
    <script src="js/features/unlocks.js"></script>
    <script src="js/features/sectors.js"></script>
    <script src="js/features/learn.js"></script>
    <script src="js/features/sync.js"></script>
    <script src="js/features/telegram.js"></script>
    <script src="js/features/walletsync.js"></script>
    <script src="js/features/theses.js"></script>
    <script src="js/features/journal.js"></script>
    

    <!-- 9. UI Enhancements -->
    <script src="js/ui/particles.js"></script>
    <script src="js/ui/tilt.js"></script>

    <!-- 10. Core App (MUST LOAD LAST) -->
    <script src="js/app.js"></script>

    <!-- 11. Initialization -->
    <script src="js/init.js"></script>
  </body>
</html>
