<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <!--
    ================================================================
    Weaver — index.html (production, cross-device, CSP-strict)
    ================================================================
    Security headers set in <meta> where the browser honours them.
    Headers that CANNOT be set via <meta> (X-Frame-Options,
    Strict-Transport-Security, X-Content-Type-Options,
    Cross-Origin-Opener-Policy, Cross-Origin-Embedder-Policy,
    Permissions-Policy, full Report-To) must be configured at the
    HTTP layer. On GitHub Pages that is not possible; on a custom
    host (Cloudflare Pages, Netlify, a reverse proxy) set them there.

    Similarly, the CSP directives frame-ancestors, report-uri,
    report-to, and sandbox are IGNORED when delivered via <meta>.
    Clickjacking protection therefore requires the X-Frame-Options
    header at the HTTP layer, not a meta-tag directive.

    Recommended HTTP headers (for the host layer):
      Strict-Transport-Security: max-age=63072000; includeSubDomains; preload
      X-Content-Type-Options: nosniff
      X-Frame-Options: DENY
      Referrer-Policy: strict-origin-when-cross-origin
      Cross-Origin-Opener-Policy: same-origin
      Cross-Origin-Resource-Policy: same-origin
      Permissions-Policy: accelerometer=(), autoplay=(), camera=(),
        display-capture=(), encrypted-media=(), fullscreen=(self),
        geolocation=(), gyroscope=(), magnetometer=(), microphone=(),
        midi=(), payment=(), picture-in-picture=(),
        publickey-credentials-get=(self), screen-wake-lock=(),
        sync-xhr=(), usb=(), web-share=(), xr-spatial-tracking=()
    ================================================================
  -->

  <!-- Charset must be the first meta. Encoded as UTF-8. -->
  <meta charset="UTF-8">

  <!-- Viewport. No maximum-scale / user-scalable restrictions —
       accessibility best practice. viewport-fit=cover is required
       for env(safe-area-inset-*) to return non-zero values on iOS. -->
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <!-- Native UI theme awareness. Prevents white flash on dark-mode
       devices before CSS loads. -->
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#07080d" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f5f7fa" media="(prefers-color-scheme: light)">

  <!-- PWA / home-screen install hints. iOS needs the apple-* names;
       Android uses mobile-web-app-capable. Both are safe to include
       even when no manifest is present. -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Weaver">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="application-name" content="Weaver">

  <!-- Disable iOS auto-detection of phone numbers / addresses. A
       crypto app has lots of digit strings that Safari would
       otherwise turn into tappable phone links. -->
  <meta name="format-detection" content="telephone=no,address=no,email=no,date=no,url=no">

  <!-- Referrer policy. cross-origin requests to the Worker and the
       CDN carry only the origin, not the full URL. -->
  <meta name="referrer" content="strict-origin-when-cross-origin">

  <title>Weaver — Crypto Portfolio &amp; Intelligence</title>
  <meta
    name="description"
    content="Evidence-driven crypto intelligence and safety platform. Non-custodial portfolio tracking, on-chain analysis, and thesis monitoring."
  >

  <!-- Prevent search-engine indexing of a personal app. Remove if
       you want the site to be public. -->
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet">

  <!--
    Content Security Policy.

    Every directive has a purpose:
      script-src 'self' https://cdn.jsdelivr.net
        No inline scripts. Chart.js is the only third-party script.
      style-src 'self' https://fonts.googleapis.com
        No inline styles. All styling lives in style.css or via
        CSSOM property assignment (el.style.x = "...", which is NOT
        blocked by CSP).
      connect-src 'self' + allowlist
        Every API the app actually calls, plus every host the app
        reaches via direct browser fetch (not through the Worker).
        Dead hosts removed. api.binance.com is included because
        Binance rejects Cloudflare Worker egress IPs — the direct
        browser fetch is the only path that succeeds for OHLCV.
      form-action 'none'
        All forms are JS-handled; nothing should submit off-origin.
      frame-src 'none'
        We embed no iframes.
      manifest-src 'self'
        PWA manifest only from same origin.
      worker-src 'self' blob:
        Service workers and blob workers (Chart.js offscreen path).
      upgrade-insecure-requests
        Any accidental http:// subresource is rewritten to https://.

    Directives deliberately NOT set here because the <meta> transport
    cannot carry them:
      frame-ancestors — ignored via <meta>. Clickjacking protection
        requires the X-Frame-Options HTTP header. See the note at
        the top of this file.
      report-to / report-uri — ignored via <meta>. Violation
        reporting requires the HTTP header transport.
      sandbox — ignored via <meta>.

    Note: report-to / report-uri cannot be set via <meta>; configure
    a reporting endpoint at the HTTP layer if you want violations.
  -->
  <meta
    http-equiv="Content-Security-Policy"
    content="
      default-src 'self';
      script-src 'self' https://cdn.jsdelivr.net;
      style-src 'self' https://fonts.googleapis.com;
      font-src 'self' https://fonts.gstatic.com data:;
      img-src 'self' data: https:;
      connect-src 'self'
        http://localhost:3001
        https://api.binance.com
        https://api.coinlore.net
        https://api.coinbase.com
        https://api.coinpaprika.com
        https://api.alternative.me
        https://api.dexscreener.com
        https://api.frankfurter.dev
        https://api.gopluslabs.io
        https://api.honeypot.is
        https://api.rugcheck.xyz
        https://api.openai.com
        https://api.anthropic.com
        https://api.etherscan.io
        https://api.polygonscan.com
        https://api.arbiscan.io
        https://api.snowtrace.io
        https://api.solscan.io
        https://eth.blockscout.com
        https://mempool.space
        https://ethereum.publicnode.com
        https://bsc-rpc.publicnode.com
        https://mainnet.helius-rpc.com
        https://cdn.jsdelivr.net
        https://weaver-proxy.ibis01-weaver.workers.dev;
      form-action 'none';
      frame-src 'none';
      base-uri 'self';
      object-src 'none';
      manifest-src 'self';
      worker-src 'self' blob:;
      upgrade-insecure-requests;
    "
  >

  <!-- Preconnect: TLS handshakes before the browser discovers them in
       the HTML stream. Saves ~100–300 ms on slow networks. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="preconnect" href="https://weaver-proxy.ibis01-weaver.workers.dev" crossorigin>
  <link rel="dns-prefetch" href="https://api.binance.com">
  <link rel="dns-prefetch" href="https://api.coinlore.net">
  <link rel="dns-prefetch" href="https://api.coinbase.com">
  <link rel="dns-prefetch" href="https://api.coinpaprika.com">

  <!-- Icons. -->
  <link rel="icon" type="image/png" href="assets/logo.png">
  <link rel="apple-touch-icon" href="assets/logo.png">
  <link rel="mask-icon" href="assets/logo.png" color="#7c5cff">

  <!-- PWA manifest. Comment out if you do not ship manifest.json. -->
  <link rel="manifest" href="manifest.json">

  <!-- Web fonts. display=swap prevents FOIT on slow connections. -->
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  >

  <!-- Application styles. -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!--
    Accessibility: skip link. First focusable element on the page.
    Positioning is defined in style.css (.skip-link), not inline —
    inline styles are blocked by the CSP above.
  -->
  <a href="#view" class="skip-link">Skip to main content</a>

  <!--
    <noscript>: the app is a client-rendered SPA; without JavaScript
    nothing works. Show an honest, visible message instead of a blank
    page. Styling lives in .noscript-fallback in style.css.
  -->
  <noscript>
    <div class="noscript-fallback">
      <h1>Weaver requires JavaScript</h1>
      <p>
        This application runs entirely in your browser. Enable
        JavaScript for <code>ibis01.github.io</code> and reload the
        page. No data leaves your device unless you explicitly connect
        an API.
      </p>
    </div>
  </noscript>

  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <img
          src="assets/logo.png"
          alt=""
          width="32"
          height="32"
          decoding="async"
        >
        <span>Weaver</span>
      </div>
      <nav id="nav" aria-label="Main navigation"></nav>
    </aside>

    <div class="sidebar-backdrop" id="sidebar-backdrop" hidden></div>

    <main class="main">
      <div class="topbar">
        <h1 id="page-title" class="topbar-title">Dashboard</h1>
        <button
          class="hamburger"
          id="btn-hamburger"
          type="button"
          aria-label="Toggle navigation menu"
          aria-expanded="false"
          aria-controls="nav"
        >☰</button>
        <div class="topbar-actions">
          <span id="last-updated" class="muted small" aria-live="polite"></span>
          <select id="currency" aria-label="Select display currency"></select>
          <button
            class="icon-btn"
            id="btn-refresh"
            type="button"
            title="Refresh data"
            aria-label="Refresh data"
          >↻</button>
        </div>
      </div>

      <!-- Primary content container. Modules inject here. -->
      <div id="view" role="main" tabindex="-1"></div>
    </main>
  </div>

  <!-- Global UI overlays. modal-root stays aria-hidden until a modal
       is actually open; W.ui is responsible for toggling it. -->
  <div id="toasts" class="toasts" aria-live="assertive" aria-atomic="true"></div>
  <div id="modal-root" role="dialog" aria-modal="true" aria-hidden="true"></div>

  <!--
    Chart.js from jsDelivr.

    SRI recommendation: fill in the integrity attribute before you
    call this production. See the deploy notes at the bottom of this
    file's commit message for the exact commands.

    If you bump the version in the URL, update the SRI hash in the
    same commit. A mismatched hash silently blocks Chart.js and
    breaks every chart in the app.
  -->
  <script
    src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"
    integrity="sha384-9nhczxUqK87bcKHh20fSQcTGD4qq5GhayNYSYWqwBkINBhOfQLg/P5HG5lF1urn4"
    crossorigin="anonymous"
    referrerpolicy="no-referrer"
  ></script>

  <!--
    Application bundle.

    The ?v= query string is a cache-buster. Bump it whenever you
    ship a new bundle so returning users get the fresh copy instead
    of the one in their HTTP cache or service worker.

    Current cache-buster: 20260936
  -->
  <script src="dist/bundle.min.js?v=20261011"></script>

  <!--
    Failsafe. Loaded as a separate file, NOT bundled, so it can run
    even when the bundle itself fails to parse or 404s. It polls for
    window.W after 1.5 s and, if the app never initialised, replaces
    the empty #view with an honest error card.

    defer ensures it runs after the DOM is parsed but does not block
    initial paint.
  -->
  <script src="js/failsafe.js" defer></script>
</body>
</html>
