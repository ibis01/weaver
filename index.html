<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ============================================================
         CONTENT SECURITY POLICY – Allows inline styles for Chart.js
         ============================================================ -->
    <meta
      http-equiv="Content-Security-Policy"
      content="
        default-src 'self';
        script-src 'self' https://cdn.jsdelivr.net https://js.sentry-cdn.com;
        style-src 'self' https://fonts.googleapis.com 'unsafe-inline';
        font-src 'self' https://fonts.gstatic.com;
        img-src 'self' data: https:;
        connect-src 'self' 
          https://api.coingecko.com 
          https://api.binance.com 
          https://api.mainnet-beta.solana.com 
          https://api.alternative.me 
          https://api.allorigins.win 
          https://api.codetabs.com 
          https://eth.blockscout.com 
          https://mempool.space
          https://cloudflare-eth.com
          https://cdn.jsdelivr.net
          http://localhost:3001
          http://127.0.0.1:3001;
        worker-src 'self';
        object-src 'none';
        base-uri 'self';
        form-action 'self';
      "
    />
    <title>Weaver — Crypto Portfolio Tracker</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..700&family=Sora:wght@400;600;800&display=swap"
      rel="stylesheet"
    />

    <!-- Styles -->
    <link rel="stylesheet" href="style.css" />

    <!-- PWA Manifest -->
    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#7c5cff" />
    <meta name="description" content="Privacy-first crypto portfolio tracker with AI insights." />
  </head>

  <body>
    <!-- Ambient background -->
    <div class="bg">
      <div class="orb o1"></div>
      <div class="orb o2"></div>
      <div class="orb o3"></div>
      <div class="grid-lines"></div>
      <div class="noise"></div>
    </div>

    <!-- App Shell -->
    <div class="app">
      <aside class="sidebar" role="navigation" aria-label="Main navigation">
        <div class="brand">
          <img src="assets/logo.png" alt="Weaver logo" />
          <span>Weaver</span>
        </div>
        <nav id="nav" role="menubar"></nav>
      </aside>

      <main class="main" role="main">
        <header class="topbar" role="banner">
          <h1 class="topbar-title" id="page-title">Dashboard</h1>
          <div class="topbar-actions">
            <span id="clock" class="muted small" aria-live="polite"></span>
            <select id="currency" aria-label="Select currency">
              <option value="usd">USD</option>
              <option value="ngn">NGN</option>
              <option value="eur">EUR</option>
              <option value="gbp">GBP</option>
              <option value="inr">INR</option>
              <option value="jpy">JPY</option>
              <option value="aud">AUD</option>
              <option value="cad">CAD</option>
              <option value="btc">BTC</option>
              <option value="eth">ETH</option>
            </select>
            <button class="icon-btn" id="sync-btn" title="Sync vault" aria-label="Sync your encrypted vault">🔄</button>
          </div>
        </header>
        <div id="view" role="main"></div>
      </main>
    </div>

    <!-- Toasts -->
    <div class="toasts" id="toasts" role="alert" aria-live="polite"></div>

    <!-- Modal root -->
    <div id="modal-root"></div>

    <!-- ============================================================
         SCRIPTS
         ============================================================ -->

    <!-- Chart.js (required for charts) -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>

    <!-- Sentry (optional, uncomment if you have a DSN) -->
    <!--
    <script src="https://js.sentry-cdn.com/YOUR_DSN.min.js" crossorigin="anonymous"></script>
    -->

    <!-- Weaver Production Bundle -->
    <script src="dist/bundle.min.js"></script>

    <!-- Tests (for development only – comment out in production) -->
    <script src="js/test.js"></script>
  </body>
</html>
