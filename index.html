<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weaver — Crypto Portfolio & AI Insights</title>
    <meta
      name="description"
      content="Weaver — privacy-first crypto portfolio tracker with AI insights, whale tracking and encrypted multi-device sync."
    />
    <meta property="og:type" content="website" />
    <meta
      property="og:title"
      content="Weaver — Crypto Portfolio & AI Insights"
    />
    <meta
      property="og:description"
      content="Track holdings, P/L, whales, token unlocks and AI trading signals. Private by design."
    />
    <meta property="og:url" content="https://ibis01.github.io/weaver/" />
    <meta
      property="og:image"
      content="https://ibis01.github.io/weaver/assets/og.png"
    />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="icon" href="assets/logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Sora:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#7c5cff" />
    <link rel="apple-touch-icon" href="assets/logo.png" />
  </head>
  <body>
    <div class="bg" aria-hidden="true">
      <div class="orb o1"></div>
      <div class="orb o2"></div>
      <div class="orb o3"></div>
      <div class="grid-lines"></div>
      <div class="noise"></div>
    </div>
    <div class="app">
      <aside class="sidebar">
        <div class="brand">
          <img src="assets/logo.png" alt="Weaver" /><span>Weaver</span>
        </div>
        <nav id="nav"></nav>
        <div class="sidebar-foot">
          <button id="btn-pro" class="pro-pill">✨ Upgrade to Pro</button>
        </div>
      </aside>
      <main class="main">
        <header class="topbar">
          <div class="topbar-title" id="page-title">Dashboard</div>
          <div class="topbar-actions">
            <select id="currency"></select>
            <button id="btn-refresh" class="btn ghost" title="Refresh">
              ⟳
            </button>
            <span id="last-updated" class="muted small"></span>
          </div>
        </header>
        <section id="view" class="view"></section>
      </main>
    </div>
    <div id="modal-root"></div>
    <div id="toasts" class="toasts"></div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <script src="js/ui/theme.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
    <script src="js/utils/format.js"></script>
    <script src="js/utils/debounce.js"></script>
    <script src="js/storage/storage.js"></script>
    <script src="js/api/prices.js"></script>
    <script src="js/ui/ui.js"></script>
    <script src="js/features/portfolio.js"></script>
    <script src="js/features/watchlist.js"></script>
    <script src="js/ui/dashboard.js"></script>
    <script src="js/features/explorer.js"></script>
    <script src="js/features/alerts.js"></script>
    <script src="js/features/news.js"></script>
    <script src="js/features/market.js"></script>
    <script src="js/features/ai.js"></script>
    <script src="js/features/learn.js"></script>
    <script src="js/features/web3.js"></script>
    <script src="js/features/misc.js"></script>
    <script src="js/features/whales.js"></script>
    <script src="js/features/unlocks.js"></script>
    <script src="js/features/smart.js"></script>
    <script src="js/features/optimizer.js"></script>
    <script src="js/features/trader.js"></script>
    <script src="js/features/sync.js"></script>
    <script src="js/features/gems.js"></script>
    <script src="js/features/shield.js"></script>
    <script src="js/features/sectors.js"></script>
    <script src="js/features/telegram.js"></script>
    <script src="js/features/timemachine.js"></script>
    <script src="js/features/walletsync.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
