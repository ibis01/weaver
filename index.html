<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- STRICT CONTENT SECURITY POLICY – Production Hardened -->
    <meta
      http-equiv="Content-Security-Policy"
      content="
        default-src 'self';
        script-src 'self' https://cdn.jsdelivr.net;
        style-src 'self' https://fonts.googleapis.com;
        font-src 'self' https://fonts.gstatic.com;
        img-src 'self' data: https:;
        connect-src 'self' 
          https://api.coingecko.com 
          https://api.binance.com 
          https://api.mainnet-beta.solana.com 
          https://api.alternative.me 
          https://api.allorigins.win 
          https://api.codetabs.com 
          https://eth.blockscout.com 
          https://mempool.space
          https://cloudflare-eth.com;
        worker-src 'self';
        object-src 'none';
        base-uri 'self';
        form-action 'self';
      "
    />
    <title>Weaver — Crypto Portfolio</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..700&family=Sora:wght@400;600;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- Ambient background -->
    <div class="bg">
      <div class="orb o1"></div>
      <div class="orb o2"></div>
      <div class="orb o3"></div>
      <div class="grid-lines"></div>
      <div class="noise"></div>
    </div>

    <div class="app">
      <!-- Sidebar -->
      <aside class="sidebar">
        <div class="brand">
          <img src="assets/logo.png" alt="Weaver" />
          <span>Weaver</span>
        </div>
        <nav id="nav">
          <!-- Navigation items will be generated by app.js -->
        </nav>
      </aside>

      <!-- Main content -->
      <main class="main">
        <!-- Top Bar -->
        <header class="topbar">
          <h1 class="topbar-title" id="page-title">Dashboard</h1>
          <div class="topbar-actions">
            <span id="clock" class="muted small"></span>
            <select id="currency" aria-label="Currency">
              <option value="usd">USD</option>
              <option value="ngn">NGN</option>
              <option value="eur">EUR</option>
              <option value="gbp">GBP</option>
              <option value="inr">INR</option>
              <option value="jpy">JPY</option>
              <option value="aud">AUD</option>
              <option value="cad">CAD</option>
              <option value="btc">BTC</option>
              <option value="eth">ETH</option>
            </select>
            <button
              class="icon-btn"
              id="sync-btn"
              title="Sync"
              onclick="if (W && W.sync && W.sync.syncVault) W.sync.syncVault();"
            >
              🔄
            </button>
          </div>
        </header>

        <!-- MAIN VIEW CONTAINER -->
        <div id="view"></div>
      </main>
    </div>

    <!-- Toasts -->
    <div class="toasts" id="toasts"></div>

    <!-- Modal root -->
    <div id="modal-root"></div>

    <!-- =================================================== -->
    <!-- Production Bundle (minified, all logic included)    -->
    <!-- =================================================== -->
    <script src="dist/bundle.min.js"></script>

    <!-- <script src="js/test.js"></script> -->
  </body>
</html>
