<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weaver — Crypto Portfolio &amp; Intelligence</title>
  <meta name="description" content="Evidence-driven crypto intelligence and safety platform.">

  <!-- 
    CSP Hardening (§5.3 / Global Const. P0-2):
    - No 'unsafe-inline' for scripts or styles.
    - connect-src includes all required API fallbacks (CoinGecko, CoinCap, Binance, RPCs).
    - object-src 'none' and base-uri 'self' prevent injection attacks.
  -->
  <meta
    http-equiv="Content-Security-Policy"
    content="
      default-src 'self';
      script-src 'self' https://cdn.jsdelivr.net;
      style-src 'self' https://fonts.googleapis.com;
      font-src 'self' https://fonts.gstatic.com;
      img-src 'self' data: https:;
      connect-src 'self'
        http://localhost:3001
        https://api.coingecko.com
        https://api.coincap.io
        https://api.coinpaprika.com
        https://api.alternative.me
        https://api.binance.com
        https://api.dexscreener.com
        https://api.gopluslabs.io
        https://eth.blockscout.com
        https://api.mainnet-beta.solana.com
        https://api.bscscan.com
        https://api.polygonscan.com
        https://api.arbiscan.io
        https://api.snowtrace.io
        https://mempool.space
        https://api.solscan.io
        https://api.etherscan.io
        https://cdn.jsdelivr.net
        https://weaver-proxy.ibis01-weaver.workers.dev
        https://ethereum.publicnode.com;
      worker-src 'self';
      object-src 'none';
      base-uri 'self';
    "
  >

  <link rel="icon" href="assets/logo.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <img src="assets/logo.png" alt="Weaver Logo">
        <span>Weaver</span>
      </div>
      <nav id="nav" aria-label="Main navigation"></nav>
    </aside>
    
    <div class="sidebar-backdrop" id="sidebar-backdrop" hidden></div>
    
    <main class="main">
      <div class="topbar">
        <h1 id="page-title" class="topbar-title">Dashboard</h1>
        <button class="hamburger" id="btn-hamburger" aria-label="Toggle navigation menu" aria-expanded="false" aria-controls="nav">☰</button>
        <div class="topbar-actions">
          <span id="last-updated" class="muted small" aria-live="polite"></span>
          <select id="currency" aria-label="Select display currency"></select>
          <button class="icon-btn" id="btn-refresh" title="Refresh data" aria-label="Refresh data"></button>
        </div>
      </div>
      
      <!-- Primary content container. Modules inject here. -->
      <div id="view" role="main"></div>
    </main>
  </div>

  <!-- Global UI overlays -->
  <div id="toasts" class="toasts" aria-live="assertive" aria-atomic="true"></div>
  <div id="modal-root" role="dialog" aria-modal="true"></div>

  <!-- External dependencies (CSP allowed via script-src) -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  
  <!-- Application bundle -->
  <script src="dist/bundle.min.js?v=20260935"></script>
</body>
</html>
