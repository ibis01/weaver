<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weaver — Crypto Portfolio &amp; Intelligence</title>
  <meta name="description" content="Evidence-driven crypto intelligence and safety platform.">

  <meta
    http-equiv="Content-Security-Policy"
    content="
      default-src 'self';
      script-src 'self' https://cdn.jsdelivr.net;
      style-src 'self' https://fonts.googleapis.com;
      font-src 'self' https://fonts.gstatic.com;
      img-src 'self' data: https:;
      connect-src 'self'
        http://localhost:3001
        https://api.coingecko.com
        https://api.alternative.me
        https://api.binance.com
        https://api.dexscreener.com
        https://api.gopluslabs.io
        https://eth.blockscout.com
        https://api.mainnet-beta.solana.com
        https://api.bscscan.com
        https://api.polygonscan.com
        https://api.arbiscan.io
        https://api.snowtrace.io
        https://mempool.space
        https://api.solscan.io
        https://api.etherscan.io https://cdn.jsdelivr.net https://weaver-proxy.ibis01-weaver.workers.dev;
      worker-src 'self';
      object-src 'none';
      base-uri 'self';
    "
  >

  <link rel="icon" href="assets/logo.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <img src="assets/logo.png" alt="Weaver">
        <span>Weaver</span>
      </div>
      <nav id="nav"></nav>
    </aside>
    <div class="sidebar-backdrop" id="sidebar-backdrop" hidden></div>
    <main class="main">
      <div class="topbar">
        <h1 id="page-title" class="topbar-title">Dashboard</h1>
        <button class="hamburger" id="btn-hamburger" aria-label="Toggle navigation" aria-expanded="false" aria-controls="nav">☰</button>
        <div class="topbar-actions">
          <span id="last-updated" class="muted small"></span>
          <select id="currency" aria-label="Currency"></select>
          <button class="icon-btn" id="btn-refresh" title="Refresh" aria-label="Refresh">⟳</button>
        </div>
      </div>
      <div id="view"></div>
    </main>
  </div>

  <div id="toasts" class="toasts"></div>
  <div id="modal-root"></div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="dist/bundle.min.js?v=20260919"></script>
</body>
</html>
